name: weideschwein-kulmbach-ci

on:
  push:
    branches: [main, "vibe/**"]
    paths-ignore: ["orders/**", "tools/shop/out/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install beautifulsoup4 requests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: HTML validation (html-validate)
        run: npx --yes html-validate index.html

      - name: Site checks (Assets, Anker, Links, Inhaltsparitaet, Template-Tokens)
        run: python3 tools/check_site.py

      - name: Upload homepage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage
          path: |
            index.html
            assets/
            README.md
          retention-days: 14
